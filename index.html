<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องทดลองประกอบร่างเศษส่วน (Fraction Fusion Lab)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0fdfa;
        }
        
        /* Custom Shake Animation for Guardrail */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .fraction-grid {
            display: grid;
            width: 100%;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .cell {
            border-right: 2px solid white;
            transition: background-color 0.3s ease, width 0.3s ease;
        }
        .cell:last-child {
            border-right: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 text-gray-800">

    <!-- Header -->
    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-xl p-8 mb-8 text-center border-t-8 border-teal-500">
        <h1 class="text-3xl md:text-4xl font-bold text-teal-600 mb-2">🧩 ห้องทดลองประกอบร่างเศษส่วน</h1>
        <p class="text-lg text-gray-600">เป้าหมาย: ทำให้ขนาด "ชิ้นส่วน" (ช่องย่อย) เท่ากันก่อน จึงจะเทรวมกันได้!</p>
    </div>

    <!-- Main Workspace -->
    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-xl p-6 md:p-10 flex flex-col gap-8">
        
        <!-- Fraction A Area -->
        <div class="flex flex-col md:flex-row items-center gap-6 bg-blue-50 p-6 rounded-2xl border-2 border-blue-100">
            <div class="w-full md:w-1/4 text-center">
                <h2 class="text-xl font-bold text-blue-600 mb-2">สารตั้งต้น A</h2>
                <div class="text-3xl font-black text-blue-700" id="text-frac-a">1/2</div>
            </div>
            <div class="w-full md:w-1/2">
                <div id="grid-a" class="fraction-grid bg-gray-200"></div>
            </div>
            <div class="w-full md:w-1/4 flex flex-col gap-2 items-center">
                <span class="text-sm font-semibold text-gray-500">เครื่องมือซอยย่อย</span>
                <div class="flex gap-2">
                    <button onclick="decreaseSubdivision('A')" class="w-12 h-12 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-2xl flex items-center justify-center transition active:scale-95 shadow-sm">-</button>
                    <button onclick="increaseSubdivision('A')" class="w-12 h-12 rounded-full bg-blue-500 hover:bg-blue-600 text-white font-bold text-2xl flex items-center justify-center transition active:scale-95 shadow-md">+</button>
                </div>
                <div class="text-sm text-blue-600 font-medium mt-1">แบ่ง x<span id="mult-a">1</span></div>
            </div>
        </div>

        <!-- Math Operator (+) -->
        <div class="flex justify-center -my-4 relative z-10">
            <div class="w-14 h-14 bg-yellow-400 rounded-full flex items-center justify-center text-white text-3xl font-black shadow-lg border-4 border-white">
                +
            </div>
        </div>

        <!-- Fraction B Area -->
        <div class="flex flex-col md:flex-row items-center gap-6 bg-green-50 p-6 rounded-2xl border-2 border-green-100">
            <div class="w-full md:w-1/4 text-center">
                <h2 class="text-xl font-bold text-green-600 mb-2">สารตั้งต้น B</h2>
                <div class="text-3xl font-black text-green-700" id="text-frac-b">1/3</div>
            </div>
            <div class="w-full md:w-1/2">
                <div id="grid-b" class="fraction-grid bg-gray-200"></div>
            </div>
            <div class="w-full md:w-1/4 flex flex-col gap-2 items-center">
                <span class="text-sm font-semibold text-gray-500">เครื่องมือซอยย่อย</span>
                <div class="flex gap-2">
                    <button onclick="decreaseSubdivision('B')" class="w-12 h-12 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-2xl flex items-center justify-center transition active:scale-95 shadow-sm">-</button>
                    <button onclick="increaseSubdivision('B')" class="w-12 h-12 rounded-full bg-green-500 hover:bg-green-600 text-white font-bold text-2xl flex items-center justify-center transition active:scale-95 shadow-md">+</button>
                </div>
                <div class="text-sm text-green-600 font-medium mt-1">แบ่ง x<span id="mult-b">1</span></div>
            </div>
        </div>

        <!-- Merge Action Area -->
        <div class="flex flex-col items-center mt-4">
            <button id="btn-merge" onclick="attemptMerge()" class="bg-gradient-to-r from-orange-400 to-pink-500 hover:from-orange-500 hover:to-pink-600 text-white text-2xl font-bold py-4 px-12 rounded-full shadow-xl transform transition active:scale-95 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                เทรวมปริมาณ (Add)
            </button>
            <div id="message-box" class="mt-4 px-6 py-3 rounded-lg text-lg font-bold opacity-0 transition-opacity duration-300">
                <!-- Messages will appear here -->
            </div>
        </div>

        <!-- Result Area (Hidden initially) -->
        <div id="result-area" class="hidden flex-col items-center gap-6 bg-purple-50 p-6 rounded-2xl border-4 border-purple-300 mt-4 animate-[fadeIn_0.5s_ease-out]">
            <h2 class="text-2xl font-black text-purple-700">🎉 ผลลัพธ์การเทรวม</h2>
            <div class="w-full md:w-2/3">
                <div id="grid-result" class="fraction-grid bg-gray-200"></div>
            </div>
            <div class="text-4xl font-black text-purple-800 bg-white px-8 py-4 rounded-xl shadow-inner border-2 border-purple-100" id="text-frac-result">
                2/6 + 3/6 = 5/6
            </div>
            <button onclick="resetGame()" class="mt-4 text-purple-600 underline font-semibold hover:text-purple-800">
                เริ่มโจทย์ใหม่ (Reset)
            </button>
        </div>

    </div>

    <script>
        // State variables
        const state = {
            A: { baseNum: 1, baseDen: 2, multiplier: 1 }, // 1/2
            B: { baseNum: 1, baseDen: 3, multiplier: 1 }  // 1/3
        };

        let hasMerged = false;

        // Initialize DOM Elements
        const gridA = document.getElementById('grid-a');
        const gridB = document.getElementById('grid-b');
        const textA = document.getElementById('text-frac-a');
        const textB = document.getElementById('text-frac-b');
        const multA = document.getElementById('mult-a');
        const multB = document.getElementById('mult-b');
        const msgBox = document.getElementById('message-box');
        const btnMerge = document.getElementById('btn-merge');
        const resultArea = document.getElementById('result-area');
        const gridResult = document.getElementById('grid-result');
        const textResult = document.getElementById('text-frac-result');

        // Core Render Function
        function renderFraction(fractionKey, gridElement, textElement, colorClass) {
            const frac = state[fractionKey];
            const currentNum = frac.baseNum * frac.multiplier;
            const currentDen = frac.baseDen * frac.multiplier;

            // Update Text
            textElement.innerText = `${currentNum}/${currentDen}`;
            if(fractionKey === 'A') multA.innerText = frac.multiplier;
            if(fractionKey === 'B') multB.innerText = frac.multiplier;

            // Update Grid Layout
            gridElement.style.gridTemplateColumns = `repeat(${currentDen}, 1fr)`;
            
            // Render Cells
            gridElement.innerHTML = '';
            for (let i = 0; i < currentDen; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell ' + (i < currentNum ? colorClass : 'bg-gray-200');
                gridElement.appendChild(cell);
            }
        }

        function updateAll() {
            renderFraction('A', gridA, textA, 'bg-blue-400');
            renderFraction('B', gridB, textB, 'bg-green-400');
            
            // Clear result if state changes after merge
            if (hasMerged) {
                resultArea.classList.add('hidden');
                resultArea.classList.remove('flex');
                hasMerged = false;
                showMessage("", "", false);
            }
        }

        // Interaction Functions
        function increaseSubdivision(key) {
            if (state[key].multiplier < 10) { // Limit to avoid performance issues
                state[key].multiplier++;
                updateAll();
                showMessage("", "", false); // clear warnings
            }
        }

        function decreaseSubdivision(key) {
            if (state[key].multiplier > 1) {
                state[key].multiplier--;
                updateAll();
                showMessage("", "", false);
            }
        }

        // Error Handling / Guardrail
        function showMessage(text, type, isVisible) {
            if (!isVisible) {
                msgBox.style.opacity = '0';
                return;
            }
            msgBox.innerText = text;
            msgBox.style.opacity = '1';
            
            if (type === 'error') {
                msgBox.className = 'mt-4 px-6 py-3 rounded-lg text-lg font-bold bg-red-100 text-red-600 border-2 border-red-300 transition-opacity duration-300';
            } else if (type === 'success') {
                msgBox.className = 'mt-4 px-6 py-3 rounded-lg text-lg font-bold bg-purple-100 text-purple-600 border-2 border-purple-300 transition-opacity duration-300';
            }
        }

        function attemptMerge() {
            const currentDenA = state.A.baseDen * state.A.multiplier;
            const currentDenB = state.B.baseDen * state.B.multiplier;

            if (currentDenA !== currentDenB) {
                // Guardrail activated
                btnMerge.classList.add('shake');
                showMessage("🛑 ขนาดชิ้นส่วน (ตัวส่วน) ยังไม่เท่ากัน เทรวมกันไม่ได้นะ! ลองซอยย่อยให้เท่ากันก่อน", "error", true);
                
                // Remove shake class after animation completes
                setTimeout(() => {
                    btnMerge.classList.remove('shake');
                }, 500);
            } else {
                // Success Merge
                doMerge(currentDenA);
            }
        }

        function doMerge(commonDen) {
            const numA = state.A.baseNum * state.A.multiplier;
            const numB = state.B.baseNum * state.B.multiplier;
            const totalNum = numA + numB;

            showMessage(`เก่งมาก! ตอนนี้ชิ้นส่วนขนาด ${commonDen} เท่ากันแล้ว เทรวมกันได้เลย!`, "success", true);
            hasMerged = true;

            // Show result area
            resultArea.classList.remove('hidden');
            resultArea.classList.add('flex');

            // Render Result Grid
            // If totalNum > commonDen, we might need more grids, but for 1/2 + 1/3 it's 5/6 (less than 1)
            // To handle cases > 1 gracefully, we'll ensure the grid expands or wraps, but let's stick to 1 grid for this pedagogical scope.
            let displayDen = Math.max(commonDen, totalNum); // Ensure we have enough boxes to show the result if > 1
            
            gridResult.style.gridTemplateColumns = `repeat(${commonDen}, 1fr)`;
            
            // If the fraction exceeds 1 whole (e.g. 7/6), the grid should still show units of commonDen, but wrap.
            // For simplicity in this specific 1/2 + 1/3 demo, it fits in one bar.
            if(totalNum > commonDen) {
               gridResult.style.height = 'auto'; // allow expanding
               gridResult.style.display = 'flex';
               gridResult.style.flexWrap = 'wrap';
            } else {
               gridResult.style.display = 'grid';
               gridResult.style.height = '80px';
            }

            gridResult.innerHTML = '';
            for (let i = 0; i < Math.max(commonDen, totalNum); i++) {
                const cell = document.createElement('div');
                let cellClass = 'cell ';
                
                // Color mapping: First part blue, second part green, empty gray
                if (i < numA) {
                    cellClass += 'bg-blue-400';
                } else if (i < numA + numB) {
                    cellClass += 'bg-green-400';
                } else {
                    cellClass += 'bg-gray-200';
                }

                if(totalNum > commonDen) {
                   cell.style.width = `calc(100% / ${commonDen})`;
                   cell.style.height = '80px';
                   cell.style.borderRight = '2px solid white';
                   cell.style.borderBottom = '2px solid white';
                }

                cell.className = cellClass;
                gridResult.appendChild(cell);
            }

            // Update Equation Text
            textResult.innerText = `${numA}/${commonDen} + ${numB}/${commonDen} = ${totalNum}/${commonDen}`;
        }

        function resetGame() {
            state.A.multiplier = 1;
            state.B.multiplier = 1;
            hasMerged = false;
            resultArea.classList.add('hidden');
            resultArea.classList.remove('flex');
            showMessage("", "", false);
            updateAll();
        }

        // Initial render
        window.onload = () => {
            updateAll();
        };

    </script>
</body>
</html>
